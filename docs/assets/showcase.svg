<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="'Segoe UI',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif">
  <!-- Vocium README showcase — one 9-second loop:
       idle → hotkey → listening → hotkey → transcribing → text typed into the
       focused field → done. Pure SVG + CSS keyframes (GitHub renders it via
       <img>, no JS). Colours are the app's real design tokens (styles.css). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a3a"/>
      <stop offset=".45" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0e1117"/>
    </linearGradient>
    <linearGradient id="pillbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip1"><rect id="typerect1" x="0" y="0" width="0" height="52"/></clipPath>
    <clipPath id="clip2"><rect id="typerect2" x="0" y="52" width="0" height="40"/></clipPath>
    <style><![CDATA[
      :root{ --t:9s; }
      .txt{fill:#e6edf3} .dim{fill:#8b949e} .accent{fill:#6ad0c8}
      .pill-label{font-size:15px;font-weight:600;letter-spacing:.3px;fill:#e6edf3}
      .state{opacity:0;animation:var(--t) linear infinite}
      /* ── state visibility over the 9 s loop (percentages of 9 s) ── */
      .st-idle   {animation-name:showIdle}
      .st-listen {animation-name:showListen}
      .st-trans  {animation-name:showTrans}
      .st-inject {animation-name:showInject}
      @keyframes showIdle   {0%,10%{opacity:1} 11%,92%{opacity:0} 93%,100%{opacity:1}}
      @keyframes showListen {0%,10%{opacity:0} 11%,43%{opacity:1} 44%,100%{opacity:0}}
      @keyframes showTrans  {0%,43%{opacity:0} 44%,58%{opacity:1} 59%,100%{opacity:0}}
      @keyframes showInject {0%,58%{opacity:0} 59%,92%{opacity:1} 93%,100%{opacity:0}}

      /* idle orb breathes */
      .core-idle{transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scale(.82);opacity:.7}50%{transform:scale(1);opacity:1}}
      /* listening: equaliser bars + expanding ring */
      .bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq .9s ease-in-out infinite}
      .bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.15s}
      .bar:nth-child(3){animation-delay:.3s}.bar:nth-child(4){animation-delay:.45s}.bar:nth-child(5){animation-delay:.2s}
      @keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
      .ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
      @keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
      /* transcribing: spinner */
      .spin{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* inject: pop */
      .check{transform-box:fill-box;transform-origin:center;animation:var(--t) linear infinite;animation-name:pop}
      @keyframes pop{0%,58%{transform:scale(.2)}60%{transform:scale(1.18)}62%,100%{transform:scale(1)}}

      /* hotkey chip presses at 10% and 43% */
      .key{transform-box:fill-box;transform-origin:center;animation:var(--t) linear infinite;animation-name:press}
      @keyframes press{0%,9%{transform:scale(1)}10%{transform:scale(.93)}12%,42%{transform:scale(1)}43%{transform:scale(.93)}45%,100%{transform:scale(1)}}
      .keyglow{animation:var(--t) linear infinite;animation-name:keyglow}
      @keyframes keyglow{0%,9%{opacity:0}10%{opacity:1}14%,42%{opacity:0}43%{opacity:1}47%,100%{opacity:0}}

      /* waveform under the pill while listening */
      .wave{stroke:#3ddc97;stroke-width:2;fill:none;stroke-linecap:round;animation:var(--t) linear infinite;animation-name:showListen}
      .wave path{transform-box:fill-box;transform-origin:center;animation:wobble 1.1s ease-in-out infinite alternate}
      @keyframes wobble{from{transform:scaleY(.55)}to{transform:scaleY(1.25)}}

      /* typing: the clip rect widens from 59% to 86% of the loop */
      #typerect1{animation:var(--t) steps(16,end) infinite;animation-name:type1}
      @keyframes type1{0%,59%{width:0}75%,100%{width:320px}}
      #typerect2{animation:var(--t) steps(9,end) infinite;animation-name:type2}
      @keyframes type2{0%,75%{width:0}85%,100%{width:180px}}
      .caret{animation:var(--t) linear infinite;animation-name:caret}
      @keyframes caret{0%,85%{opacity:0}86%,92%{opacity:1}93%,100%{opacity:0}}
      .caretblink{animation:blink 1s steps(2,end) infinite}
      @keyframes blink{to{opacity:0}}
      .placeholder{animation:var(--t) linear infinite;animation-name:ph}
      @keyframes ph{0%,58%{opacity:1}59%,100%{opacity:0}}
      .sent{animation:var(--t) linear infinite;animation-name:sent}
      @keyframes sent{0%,87%{opacity:0}89%,92%{opacity:1}93%,100%{opacity:0}}
      .hint{animation:var(--t) linear infinite}
      .hint-1{animation-name:h1}.hint-2{animation-name:h2}.hint-3{animation-name:h3}.hint-4{animation-name:h4}
      @keyframes h1{0%,10%{opacity:1}11%,92%{opacity:0}93%,100%{opacity:1}}
      @keyframes h2{0%,10%{opacity:0}11%,43%{opacity:1}44%,100%{opacity:0}}
      @keyframes h3{0%,43%{opacity:0}44%,58%{opacity:1}59%,100%{opacity:0}}
      @keyframes h4{0%,58%{opacity:0}59%,92%{opacity:1}93%,100%{opacity:0}}
    ]]></style>
  </defs>

  <!-- backdrop -->
  <rect width="940" height="380" rx="18" fill="url(#bg)"/>

  <!-- ── floating pill (top centre) ── -->
  <g transform="translate(470 54)" filter="url(#shadow)">
    <!-- idle -->
    <g class="state st-idle">
      <rect x="-78" y="-23" width="156" height="46" rx="16" fill="url(#pillbg)" stroke="rgba(255,255,255,.10)"/>
      <circle class="core-idle" cx="-50" cy="0" r="9.5" fill="#6ad0c8"/>
      <text class="pill-label" x="-28" y="5.5">Vocium</text>
    </g>
    <!-- listening -->
    <g class="state st-listen">
      <rect x="-84" y="-23" width="168" height="46" rx="16" fill="url(#pillbg)" stroke="rgba(255,255,255,.10)"/>
      <circle class="ring" cx="-56" cy="0" r="16" fill="none" stroke="#3ddc97" stroke-width="2"/>
      <g transform="translate(-65 12)" fill="#3ddc97">
        <rect class="bar" x="0"  y="-24" width="3" height="24" rx="1.5"/>
        <rect class="bar" x="5"  y="-24" width="3" height="24" rx="1.5"/>
        <rect class="bar" x="10" y="-24" width="3" height="24" rx="1.5"/>
        <rect class="bar" x="15" y="-24" width="3" height="24" rx="1.5"/>
        <rect class="bar" x="20" y="-24" width="3" height="24" rx="1.5"/>
      </g>
      <text class="pill-label" x="-32" y="5.5">聆聽中…</text>
    </g>
    <!-- transcribing -->
    <g class="state st-trans">
      <rect x="-84" y="-23" width="168" height="46" rx="16" fill="url(#pillbg)" stroke="rgba(255,255,255,.10)"/>
      <circle cx="-56" cy="0" r="7" fill="#f5a623"/>
      <circle class="spin" cx="-56" cy="0" r="14" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-dasharray="44 44" stroke-linecap="round"/>
      <text class="pill-label" x="-32" y="5.5">轉錄中…</text>
    </g>
    <!-- injected -->
    <g class="state st-inject">
      <rect x="-84" y="-23" width="168" height="46" rx="16" fill="url(#pillbg)" stroke="rgba(255,255,255,.10)"/>
      <circle cx="-56" cy="0" r="14" fill="none" stroke="#7c5cff" stroke-width="2" opacity=".4"/>
      <path class="check" d="M-63 0.5 L-58.5 5 L-49 -5" fill="none" stroke="#7c5cff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="pill-label" x="-32" y="5.5">輸入完成</text>
    </g>
  </g>

  <!-- waveform while listening -->
  <g class="wave" transform="translate(470 110)">
    <g style="transform-origin:0 0">
      <path d="M-120 0 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" opacity=".9"/>
    </g>
  </g>

  <!-- ── the "any app" text field ── -->
  <g transform="translate(150 170)">
    <rect x="0" y="0" width="640" height="112" rx="14" fill="#161b22" stroke="rgba(255,255,255,.10)"/>
    <rect x="0" y="0" width="640" height="112" rx="14" fill="none" stroke="#6ad0c8" stroke-opacity=".35"/>
    <text class="dim" x="20" y="-14" font-size="12.5" letter-spacing=".4">任何 App 的輸入框 · any text field</text>
    <!-- placeholder -->
    <text class="dim placeholder" x="22" y="44" font-size="18">輸入訊息…</text>
    <!-- typed transcript (revealed by the widening clip) -->
    <g transform="translate(22 0)">
      <g clip-path="url(#clip1)"><text class="txt" x="0" y="44" font-size="18">幫我把這段會議的重點整理成三條，</text></g>
      <g clip-path="url(#clip2)"><text class="txt" x="0" y="84" font-size="18">並用繁體中文回覆。</text></g>
    </g>
    <!-- caret follows the end of the second line after typing -->
    <g class="caret"><rect class="caretblink" x="190" y="68" width="2" height="22" fill="#6ad0c8"/></g>
    <!-- "sent" tick -->
    <g class="sent" transform="translate(596 86)">
      <circle r="13" fill="#7c5cff"/>
      <path d="M-6 0 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ── hotkey chip ── -->
  <g transform="translate(150 322)">
    <g class="keyglow" filter="url(#glow)"><rect x="-6" y="-6" width="212" height="44" rx="12" fill="#6ad0c8" opacity=".35"/></g>
    <g class="key">
      <rect x="0" y="0" width="200" height="32" rx="9" fill="#1c2230" stroke="rgba(255,255,255,.14)"/>
      <text class="txt" x="100" y="21" font-size="13.5" font-weight="600" text-anchor="middle" letter-spacing=".5">Ctrl + Shift + Space</text>
    </g>
  </g>

  <!-- ── step hints (right of the chip) ── -->
  <g transform="translate(380 343)" font-size="14">
    <text class="hint hint-1 dim" x="0" y="0">① 游標停在任何輸入框，按下快捷鍵</text>
    <text class="hint hint-2 txt" x="0" y="0"><tspan fill="#3ddc97">●</tspan> 開口說話… 再按一次結束</text>
    <text class="hint hint-3 txt" x="0" y="0"><tspan fill="#f5a623">●</tspan> AI 轉錄 → 潤稿 → 繁簡轉換</text>
    <text class="hint hint-4 txt" x="0" y="0"><tspan fill="#7c5cff">●</tspan> 文字直接落在原本的輸入框</text>
  </g>

  <!-- brand corner -->
  <text class="dim" x="912" y="360" font-size="12" text-anchor="end" letter-spacing=".6">Vocium · BYOK · 單一行程</text>
</svg>
