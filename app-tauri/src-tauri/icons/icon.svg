<?xml version="1.0" encoding="UTF-8"?>
<!-- Vocium app icon — master (vector source of truth). Concept "AI mic":
     a bold white-to-mint microphone (capsule + cradle with stem/base) plus one
     AI sparkle, on a mid-tone violet tile. Built to survive 16 px on BOTH dark
     (#1f1f1f) and light (#f3f3f3) shells:
       - the tile sits in the violet luminance band (L 0.15-0.22), so its edge
         keeps >= 3.1:1 against #1f1f1f AND >= 3.5:1 against #f3f3f3 (the old
         navy tile was ~1.1:1 against a dark taskbar and vanished);
       - the glyph is 3 shapes (capsule, cradle+stem+base, sparkle); every
         stroke is 32 units (= 2 px at 16 px) and every gap is 16 units (= 1 px);
       - all edges sit on the 16-unit grid (1 px at 16 px, 2 px at 32 px), and
         the cradle is a squared "U", so the 16/32 px renders stay crisp
         instead of turning into anti-aliased mush.
     Full-bleed 256 square (the OS rounds corners where it wants). No <use>,
     filters or text, so every rasterizer renders it identically.
     Rasterize via scripts/gen-icons.mjs. Companion tray glyph: tray.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Tile: brand violet, kept inside a mid luminance band for dual-theme contrast. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8466ff"/>
      <stop offset="1" stop-color="#6c4ef6"/>
    </linearGradient>
    <!-- Glyph: white (max contrast on the tile) fading to brand-teal mint. -->
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="224">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8cefe3"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#tile)"/>

  <g fill="url(#glyph)">
    <!-- Shape 1: mic capsule. -->
    <rect x="96" y="32" width="64" height="96" rx="32"/>
    <!-- Shape 2: squared-U cradle (stroke 32) + stem + base, one connected piece. -->
    <path d="M64 112 V128 A32 32 0 0 0 96 160 H160 A32 32 0 0 0 192 128 V112"
          fill="none" stroke="url(#glyph)" stroke-width="32" stroke-linecap="round"/>
    <rect x="112" y="176" width="32" height="32"/>
    <rect x="80" y="192" width="96" height="32" rx="16"/>
  </g>

  <!-- Shape 3: AI sparkle (4-point concave star in a 48x48 box at 176,32; baked
       transform so it rasterizes identically everywhere). -->
  <path d="M16 0 C17.8 11.2 20.8 14.2 32 16 C20.8 17.8 17.8 20.8 16 32
           C14.2 20.8 11.2 17.8 0 16 C11.2 14.2 14.2 11.2 16 0 Z"
        fill="#c9fff7" transform="translate(176 32) scale(1.5)"/>
</svg>
