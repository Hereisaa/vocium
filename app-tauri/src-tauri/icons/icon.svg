<?xml version="1.0" encoding="UTF-8"?>
<!-- Vocium app icon: master, vector source of truth.
     Concept "Swash": a solid black disc (the "o" of Vocium) cut once by a hand-lettered V. One solid black mark (no gradient, no outline, no second colour)
     on a flat white 256 tile. The cut is the whole idea: a V is what an open mouth looks like from the front, the
     disc is the "o" of Vocium (and the round shape of a bubble), and the wedge that the V frees from the disc is the
     word leaving it. It reads as the letter V and as a speech form at once, and it is one gesture, not a letter
     plus an object.

     Construction (256 canvas; the mark is moved by 0.1, -1.7 for optical centring, so every number below
     is the pre-shift value; the path data is final):
       disc      circle r = 104 centred (128,128), so the mark box is 24..232 (208 = 81 % of the tile, 9.4 % margin
                 on every side before the nudge)
       gap       ONE V-shaped channel of constant width 28 (1.75 px at 16 px), vertex centreline at (124,176).
                 Left arm leaves the vertex 26 deg off the vertical and relaxes to 40 deg; right arm leaves at 34 deg and relaxes to 56 deg,
                 so the V's axis leans 4 deg (at the vertex) to 8 deg (at the rim) to the right, like a hand-lettered V.
                 Each arm is one cubic Bezier whose handles are 0.42 of the arm length, so the flanks flare very slightly
                 (radius of curvature about 400 to 800); the vertex is a sharp V softened by a radius of 7.
       pieces    the channel splits the disc into two shapes: the fin (the wedge above the V, with the disc's arc as
                 its top) and the bowl (everything below and beside it). Both are one closed contour each.
       corners   every convex corner (horn tips, fin shoulders, fin tip) is rounded to r = 6, the concave vertex to
                 r = 7, and the transitions are blended with a Gaussian of sigma 1.5 so the curvature changes
                 continuously instead of jumping at the tangent points (no elbow bumps).
       curves    the two contours are fitted to 12 and 14 cubic Beziers (G1 at every node, maximum
                 deviation from the constructed outline 0.05 units); the long edges are true arcs or near-straight cubics.
       centring  mean of the bounding-box centre and the ink centroid is the tile centre (the bowl is the heavy part).
     Legibility at 16 px: gap 1.75 px, chin below the V 2.2 px, fin 7.3 px tall, ink 39.8 % of the tile,
     margin to the tile edge at least 8.7 %; no black feature is thinner than 2 px except the last 2 px of the two
     horn tips (acute corners, not strokes). Colour: one ink (#000000) on #ffffff, contrast 21:1.
     Full-bleed square (the OS rounds the corners). Rasterize via scripts/gen-icons.mjs; companion tray glyph: tray.svg;
     rationale, construction diagram, the other finalists and why the five earlier marks were retired:
     docs/ICON_DESIGN.html. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
