<?xml version="1.0" encoding="UTF-8"?>
<!-- Vocium app icon: master, vector source of truth.
     Concept "Cut-V Bubble": a V cut through a speech bubble. One solid black silhouette (no gradient, no
     outline, no second colour); the V is the slit that splits the bubble into a body and a droplet, the
     two soft pieces of a single mark. It reads as a speech bubble and as the letter V at the same time.

     Construction: 256 canvas, module u = 16 (1 u = 1 px at 16 px).
       bubble   circle r = 6u (96) centred on the canvas (128,128); its box is 12u x 12u (32..224), a 2u margin
                on every side, so the straight bottom and left edges fall on whole pixels at 16 px. The
                lower-left quadrant is squared off into the speech-tail corner at (32,224).
       slit     the V: two parallel-sided arms 2.5u (40) wide, each 30 degrees off the vertical (a 60-degree
                V, so the wedge between the arms is an equilateral triangle), meeting in a round vertex
                centred at (128,160) = 10u. The arms run out through the rim, so the bubble falls into two
                pieces: the body and the wedge (the droplet between the arms). The wedge's sharp crotch
                would sit at (128,120) = 7.5u.
       corners  one radius for every corner: r = 20 = 1.25u = half the slit width. It rounds the slit
                vertex, the two rim terminals of the body, the wedge tip and its two rim corners, and the
                tail corner, so every terminal is a 40-unit (2.5 px) round cap.
       paths    two closed subpaths in one path: the body (clockwise) and the wedge (counter-clockwise);
                they never overlap, so the fill rule is irrelevant.
     Legibility at 16 px: slit 2.5 px, every round cap 2.5 px, the black chin under the V 2.75 px, margin to
     the tile edge 2 px. No stroke is thinner than the 2 px (2/16) rule.
     Colour: one ink (#000000) on a flat tile (#ffffff); contrast 21:1 on white, no gradient banding.
     Full-bleed square (the OS rounds the corners). Rasterize via scripts/gen-icons.mjs; the companion tray
     glyph is tray.svg; rationale and construction diagram: docs/ICON_DESIGN.html. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#ffffff"/>
  <path fill="#000000" d="M221.71 107.16A96 96 0 0 1 128 224L52 224A20 20 0 0 1 32 204L32 128A96 96 0 0 1 34.29 107.16A20 20 0 0 1 71.13 101.5L110.68 170A20 20 0 0 0 145.32 170L184.87 101.5A20 20 0 0 1 221.71 107.16ZM145.32 90L160.59 63.55A20 20 0 0 0 147.29 33.96A96 96 0 0 0 108.71 33.96A20 20 0 0 0 95.41 63.55L110.68 90A20 20 0 0 0 145.32 90Z"/>
</svg>
