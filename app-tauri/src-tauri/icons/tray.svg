<?xml version="1.0" encoding="UTF-8"?>
<!-- Vocium tray / menu-bar glyph (vector source of truth for tray-16/22/32/44.png).
     Single-colour silhouette of the app icon's "Voice Ribbon": the same bubble with the same sine
     ribbon cut out of it (bubble minus ribbon). Drawn on a 32 grid (1 unit = 1/8 of the 256 master,
     2 units = 1 px at 16 px), so the construction is the app icon at 1/8 scale:
       bubble = 26 x 16 (13u x 8u golden rectangle, 13:8 = 1.625) at (2,6), corner radius 6 (3u),
                square bottom-left corner + 45-degree tail with legs 4 (2u);
       ribbon = sine, wavelength 16 (8u), peak-to-peak 4 (2u), stroke 4 (2u = 2 px at 16 px).
     Differences from the app icon, all forced by having no tile:
       - peak-to-peak is 2u instead of 3u, so the ring above and below the ribbon stays 4 units = 2 px
         at 16 px (3u leaves 1.5 px rings that smear into grey);
       - the ribbon stops 3 units (1.5 px) short of the flanks (round caps), so the silhouette keeps a closed bubble
         outline (a ribbon running flank to flank splits the glyph into two wavy bars that read as "~~");
       - the bubble sits at x = 2 (not centred at 3) so that every edge is on an even coordinate, i.e.
         on a whole pixel at 16 px (and on the 16-unit grid scaled to 32).
     Windows shows the PNG as-is: #7c5cff is the one static colour with balanced contrast on both shells
     (3.79:1 on #1f1f1f, 3.92:1 on #f3f3f3). macOS loads it with icon_as_template(true): only the alpha
     channel is used and the system tints it, so the colour is irrelevant there (the glyph is a solid
     shape with a transparent ribbon, which is exactly what a template image wants).
     Shapes: bubble (with the ribbon cut out by a mask). No filters, text or <use>. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M7 14C8.3 12.98 9.55 12 11 12C12.45 12 13.7 12.98 15 14C16.3 15.02 17.55 16 19 16C20.45 16 21.7 15.02 23 14" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </mask>
  </defs>
  <path d="M8 6H22A6 6 0 0 1 28 12V16A6 6 0 0 1 22 22H6L2 26V12A6 6 0 0 1 8 6Z" fill="#7c5cff" mask="url(#cut)"/>
</svg>
