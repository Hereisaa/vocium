<?xml version="1.0" encoding="UTF-8"?>
<!-- Vocium tray / menu-bar glyph (vector source of truth for tray-dark-* and tray-light-*.png).
     The app icon's "Cut-V Bubble" without the tile: the identical mark, scaled uniformly by 28/192 and moved
     so that its 192-unit box lands on 2..30 of a 32 canvas (1 unit = 1/2 px at 16 px, so the box edges
     fall on whole pixels at 16 px; 14 px of the 16 are inked).
       slit 5.83 (2.9 px at 16 px), round caps r = 2.92 (2.9 px), chin 6.42 (3.2 px): all above the 2 px rule.
     This file is the black variant (#000000; the fill is the only colour in it). scripts/gen-icons.mjs renders
     it as tray-dark-{16,22,32,44}.png (black mark, for light taskbars / menu bars) and, with that fill swapped
     to #ffffff, as tray-light-{16,22,32,44}.png (white mark, for dark taskbars). macOS loads the black one as a
     template image (alpha only, the system tints it). The body and the wedge are separate subpaths of one
     path, so the V stays transparent and shows whatever is under the tray.
     No filters, masks, text or <use>. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <path fill="#000000" d="M29.67 12.96A14 14 0 0 1 16 30L4.92 30A2.92 2.92 0 0 1 2 27.08L2 16A14 14 0 0 1 2.33 12.96A2.92 2.92 0 0 1 7.71 12.14L13.47 22.13A2.92 2.92 0 0 0 18.53 22.13L24.29 12.14A2.92 2.92 0 0 1 29.67 12.96ZM18.53 10.46L20.75 6.6A2.92 2.92 0 0 0 18.81 2.29A14 14 0 0 0 13.19 2.29A2.92 2.92 0 0 0 11.25 6.6L13.47 10.46A2.92 2.92 0 0 0 18.53 10.46Z"/>
</svg>
