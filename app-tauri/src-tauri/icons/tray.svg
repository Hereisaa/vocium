<!-- Vocium tray / menu-bar glyph (vector source of truth for tray-dark-* and tray-light-*.png).
     The app icon's "Swash" without the tile: the same two shapes, built from the same construction and
     scaled by 0.1413 (disc diameter 208 becomes 29.4 units on a 32 canvas, bounding box
     1.3..30.7 x 1..30.4). 1 unit is 1 px at 32 px and 1/2 px at 16 px.
     The one change for the tray: the V channel is widened from 28 to 32 construction units (4.5 units on this canvas),
     so it is 2.3 px at 16 px and still opens up cleanly when the system downscales; the corner radii scale with the
     mark (about 0.85 units), which is below one pixel at 16 px, so the horn tips simply anti-alias.
     Two closed contours (the fin and the bowl), so everything outside them, including the V channel, stays
     transparent and shows whatever is under the tray.
     This file is the black variant (#000000; the fill is the only colour in it). scripts/gen-icons.mjs renders it
     as tray-dark-{16,22,32,44}.png (black mark, for light taskbars / menu bars) and, with that fill swapped to
     #ffffff, as tray-light-{16,22,32,44}.png (white mark, for dark taskbars). macOS loads the black one as a
     template image (alpha only, the system tints it).
     No filters, masks, text or <use>. -->
